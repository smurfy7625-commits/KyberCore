services:
  kyber-core:
    image: ghcr.io/smurfy7625-commits/kybercore:latest
    container_name: ${CONTAINER_NAME:-kyber-core}
    restart: unless-stopped

    ports:
      - "${KYBER_PORT:-8088}:8088"

    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-100}

      COMPOSE_ROOT: /host/Compose
      STORAGE_ROOT: /host/srv
      BACKUP_ROOT: /app/config/backups

      OMV_BRIDGE_SOCKET: /run/kyber-omv/bridge.sock

      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}

      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

      HOST_COMPOSE_ROOT: ${HOST_COMPOSE_ROOT:-/opt/compose}
      HOST_STORAGE_ROOT: ${HOST_STORAGE_ROOT:-/srv}

    volumes:
      - ./config:/app/config
      - ${HOST_COMPOSE_ROOT:-/opt/compose}:/host/Compose
      - ${HOST_STORAGE_ROOT:-/srv}:/host/srv
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/kyber-omv:/run/kyber-omv

    dns:
      - 1.1.1.1
      - 8.8.8.8

    pull_policy: always

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/auth/status', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
